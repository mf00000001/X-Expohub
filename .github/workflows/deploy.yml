# ============================================================
# ExpoHub CI/CD Pipeline
#
# 触发条件：
#   - main 分支推送 → 自动构建镜像并部署到生产环境
#   - develop 分支推送 → 自动构建镜像并部署到测试环境
#   - PR → 运行测试 + 代码检查
# ============================================================

name: ExpoHub CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".gitignore"
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - "docs/**"
      - "**.md"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILDKIT: 1

jobs:
  # ============================================================
  # Job 1: 代码检查与单元测试
  # ============================================================
  test:
    name: 🧪 Test & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_pass
          MYSQL_DATABASE: expo_hub_test
          MYSQL_USER: expo_hub
          MYSQL_PASSWORD: test_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest_root_pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx flake8 black isort

      - name: 🔍 Lint check (flake8)
        run: |
          flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503

      - name: 🔍 Format check (black)
        run: |
          black --check --line-length=120 src/ tests/

      - name: 🧪 Run tests
        env:
          DATABASE_URL: mysql+pymysql://expo_hub:test_pass@127.0.0.1:3306/expo_hub_test?charset=utf8mb4
          SECRET_KEY: test-secret-key-for-ci
          REDIS_URL: redis://127.0.0.1:6379/0
          REDIS_ENABLED: "true"
          ENVIRONMENT: test
        run: |
          pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

  # ============================================================
  # Job 2: Docker 镜像构建与推送
  # ============================================================
  build:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🐳 Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  # ============================================================
  # Job 3: 部署到生产环境
  # ============================================================
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30

    environment:
      name: production
      url: https://api.expo-hub.dev

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          known_hosts: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}

      - name: 🚀 Deploy via SSH
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} << 'EOF'
            set -e

            echo "=== 1. 进入部署目录 ==="
            cd ${{ env.DEPLOY_PATH }}

            echo "=== 2. 拉取最新代码 ==="
            git pull origin main

            echo "=== 3. 拉取最新 Docker 镜像 ==="
            docker compose pull app

            echo "=== 4. 备份数据库 ==="
            docker exec expohub-mysql mysqldump \
              -u root -p"${MYSQL_ROOT_PASSWORD}" \
              --databases expo_hub \
              --single-transaction \
              --quick \
              --lock-tables=false \
              > /tmp/backup_$(date +%Y%m%d_%H%M%S).sql

            echo "=== 5. 执行数据库迁移 ==="
            docker compose run --rm app alembic upgrade head

            echo "=== 6. 滚动重启服务 ==="
            docker compose up -d --force-recreate --no-deps app

            echo "=== 7. 健康检查 ==="
            sleep 10
            for i in {1..12}; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
              if [ "$STATUS" = "200" ]; then
                echo "✅ 健康检查通过"
                break
              fi
              echo "⏳ 等待服务启动... ($i/12)"
              sleep 5
            done

            if [ "$STATUS" != "200" ]; then
              echo "❌ 健康检查失败，触发回滚"
              docker compose up -d --force-recreate app
              exit 1
            fi

            echo "=== 8. 清理旧镜像 ==="
            docker image prune -f

            echo "=== ✅ 部署完成 ==="
          EOF

  # ============================================================
  # Job 4: 部署到测试环境
  # ============================================================
  deploy-staging:
    name: 🧪 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    timeout-minutes: 20

    environment:
      name: staging
      url: https://staging-api.expo-hub.dev

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.STAGING_SSH_KEY }}
          known_hosts: ${{ secrets.STAGING_KNOWN_HOSTS }}

      - name: 🚀 Deploy via SSH
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_DEPLOY_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} << 'EOF'
            set -e
            cd ${{ env.DEPLOY_PATH }}
            git pull origin develop
            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull app
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --force-recreate app
            echo "✅ Staging 部署完成"
          EOF
