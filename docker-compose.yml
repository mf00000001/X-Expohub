version: "3.9"

# ============================================================
# ExpoHub 展会管理平台 - Docker Compose 编排
#
# 服务组成：
#   app    - FastAPI 后端服务（四端统一 API）
#   db     - MySQL 8.0 数据库（生产环境）
#   redis  - Redis 缓存（Token 黑名单 + 缓存）
#   nginx  - Nginx 反向代理（生产环境）
#
# 使用方式：
#   开发环境：docker compose --profile dev up -d
#   生产环境：docker compose -f docker-compose.yml up -d
# ============================================================

services:
  # ========== FastAPI 后端服务 ==========
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: expohub-api:latest
    container_name: expohub-api
    # 生产环境不暴露端口，通过 nginx 反向代理
    # 开发环境可取消注释：
    # ports:
    #   - "8000:8000"
    environment:
      # 应用配置
      - APP_NAME=${APP_NAME:-ExpoHub API}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-false}

      # 数据库连接（生产用 MySQL）
      - DATABASE_URL=${DATABASE_URL:-mysql+pymysql://expo_hub:${MYSQL_PASSWORD}@db:3306/expo_hub?charset=utf8mb4}

      # JWT 配置
      - SECRET_KEY=${SECRET_KEY:?请设置 SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # Redis（生产环境启用）
      - REDIS_URL=${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      - REDIS_ENABLED=${REDIS_ENABLED:-true}

      # CORS（生产环境限定来源）
      - CORS_ORIGINS=${CORS_ORIGINS:-https://admin.expo-hub.dev,https://www.expo-hub.dev}

      # 数据库连接池
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-20}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-1800}

      # 日志
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    env_file:
      - .env
    volumes:
      # 生产环境无需挂载代码（已构建到镜像中）
      # 仅挂载数据目录（如有需要）
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - expohub-network
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # ========== MySQL 8.0 数据库 ==========
  db:
    image: mysql:8.0
    container_name: expohub-mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb_buffer_pool_size=512M
      --innodb_log_file_size=256M
      --innodb_flush_log_at_trx_commit=1
      --max_connections=200
      --slow_query_log=1
      --long_query_time=2
    volumes:
      - mysql_data:/var/lib/mysql
      # 初始化 SQL 脚本
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      # 慢查询日志
      - mysql_logs:/var/log/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-expo_hub}
      MYSQL_USER: ${MYSQL_USER:-expo_hub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}
    # 生产环境不暴露端口
    # ports:
    #   - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - expohub-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ========== Redis 缓存 ==========
  redis:
    image: redis:7-alpine
    container_name: expohub-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    # 生产环境不暴露端口
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - expohub-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ========== Nginx 反向代理 ==========
  nginx:
    image: nginx:1.25-alpine
    container_name: expohub-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - expohub-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M
    profiles:
      - prod

  # ========== phpMyAdmin（仅开发环境） ==========
  phpmyadmin:
    image: phpmyadmin:5
    container_name: expohub-phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    depends_on:
      - db
    profiles:
      - dev
    restart: unless-stopped
    networks:
      - expohub-network

# ========== 网络 ==========
networks:
  expohub-network:
    name: expohub-network
    driver: bridge

# ========== 数据卷 ==========
volumes:
  app_data:
    driver: local
  mysql_data:
    driver: local
  mysql_logs:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
