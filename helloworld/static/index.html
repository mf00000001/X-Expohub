<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - 问候服务</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 装饰性背景圆 -->
        <div class="bg-circle bg-circle--top" aria-hidden="true"></div>
        <div class="bg-circle bg-circle--bottom" aria-hidden="true"></div>

        <!-- 页面内容 -->
        <div class="card">
            <!-- 头部 -->
            <div class="card__header">
                <div class="logo" aria-hidden="true">🌍</div>
                <h1 class="card__title">Hello World</h1>
                <p class="card__subtitle">点击按钮，向我打个招呼吧 👋</p>
            </div>

            <!-- 交互区域 -->
            <div class="card__body">
                <button
                    id="greetBtn"
                    class="btn"
                    type="button"
                    aria-label="点击获取问候消息"
                >
                    <span class="btn__icon" aria-hidden="true">✨</span>
                    <span class="btn__text">点击问候</span>
                </button>

                <!-- 加载状态 -->
                <div id="loading" class="state state--loading hidden" role="status">
                    <div class="spinner" aria-hidden="true"></div>
                    <span>正在获取问候...</span>
                </div>

                <!-- 成功结果 -->
                <div id="result" class="state state--success hidden" role="alert" aria-live="polite">
                    <div class="state__icon" aria-hidden="true">🎉</div>
                    <div class="state__content">
                        <span class="state__label">服务端回复：</span>
                        <span id="messageText" class="state__message"></span>
                    </div>
                </div>

                <!-- 错误提示 -->
                <div id="error" class="state state--error hidden" role="alert" aria-live="assertive">
                    <div class="state__icon" aria-hidden="true">⚠️</div>
                    <div class="state__content">
                        <span class="state__label">请求失败：</span>
                        <span id="errorText" class="state__text"></span>
                    </div>
                    <button id="retryBtn" class="state__action" type="button">重试</button>
                </div>
            </div>

            <!-- 底部信息 -->
            <div class="card__footer">
                <span class="footer__status" role="status" aria-live="polite">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span id="statusText">就绪</span>
                </span>
                <span class="footer__version">v1.0.0</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
