# ============================================================
# ExpoHub Nginx 反向代理配置（生产环境）
# ============================================================

upstream expohub_backend {
    # FastAPI 服务（docker-compose 内部 DNS）
    server app:8000;
    # 如果多实例扩展，可以添加更多：
    # server app:8001;
    # server app:8002;
}

# ========== HTTP -> HTTPS 重定向 ==========
server {
    listen 80;
    server_name api.expo-hub.dev www.expo-hub.dev;

    # Let's Encrypt 证书验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 所有 HTTP 请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ========== HTTPS 服务 ==========
server {
    listen 443 ssl http2;
    server_name api.expo-hub.dev;

    # SSL 证书（使用 certbot 或 acme.sh 生成）
    ssl_certificate     /etc/letsencrypt/live/api.expo-hub.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.expo-hub.dev/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS（启用后浏览器强制 HTTPS）
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 安全相关 Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ========== 请求体大小限制 ==========
    client_max_body_size 20M;
    client_body_buffer_size 128k;

    # ========== 反向代理到 FastAPI ==========
    location / {
        proxy_pass http://expohub_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如需）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 缓存禁用
        proxy_buffering off;
    }

    # ========== 静态资源（如果有前端） ==========
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ========== 健康检查端点（不记录日志） ==========
    location /health {
        access_log off;
        proxy_pass http://expohub_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        return 200 "OK";
    }

    # ========== API 文档（生产环境建议关闭） ==========
    location /docs {
        deny all;
        return 404;
    }
    location /redoc {
        deny all;
        return 404;
    }

    # ========== 日志配置 ==========
    access_log /var/log/nginx/expohub_access.log;
    error_log  /var/log/nginx/expohub_error.log warn;
}
